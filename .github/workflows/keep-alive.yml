# Free Supabase projects pause after 7 days without use. This makes one tiny
# request every 3 days so voter search stays available. It reads the address and
# key from config.js, so there is nothing else to set up.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 */3 * *"   # every 3 days, 03:17 UTC (08:47 IST)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          URL=$(grep -oP "SUPABASE_URL\s*=\s*'\K[^']+" config.js)
          KEY=$(grep -oP "SUPABASE_KEY\s*=\s*'\K[^']+" config.js)
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
